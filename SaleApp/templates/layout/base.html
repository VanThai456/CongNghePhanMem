<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>


<div class="container">
  <div class="row">
    {%for p in prods%}
    <div class="col-md-3 clo-12" sylte="padding:0.7rem">
      <div class="card" >
        <img class="card-img-top" src="{{p.image}}" alt="{{p.name}}">
        <div class="card-body">
           <h4 class="card-title">{{p.name}}</h4>
            <p class="card-text">{{p.price}}</p>
            <a href="/product/{{p.id}}" class="btn btn-primary">Xem chi tiết</a>
          <a href="#" class="btn btn-danger">Đặt hàng</a>
        </div>
      </div>
    </div>
    {%endfor%}
  </div>


</body>
</html>
